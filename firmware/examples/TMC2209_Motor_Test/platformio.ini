; Standalone unloaded motor test. Does not build the tank-control firmware.
[platformio]
src_dir = .

[env:tmc2209_s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<TMC2209_Motor_Test.ino*>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
