; AquaGuard firmware - PlatformIO project (guide section 14)
; Build:   pio run -e aquaguard_s3
; Upload:  pio run -e aquaguard_s3 -t upload
; Tests:   pio test -e native

[platformio]
default_envs = aquaguard_s3

[env:aquaguard_s3]
; Tested toolchain: Arduino-ESP32 core 3.3.x. Keep these pins when rebuilding a
; commissioned unit; change them only together with a full re-test.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = web/index.html
build_flags =
  -DBOARD_HAS_PSRAM
  ; Startup messages go to the board's native USB port (the one marked USB),
  ; which is also the port used for uploading.
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.13.0
  adafruit/Adafruit NeoPixel@1.15.5
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.1
test_ignore = *

; Bench-test build for a bare board with nothing wired: a pretend tank and
; healthy inputs drive the real logic, and the valve output is never driven.
; Never install this on a wired unit. Upload: pio run -e aquaguard_s3_sim -t upload
[env:aquaguard_s3_sim]
extends = env:aquaguard_s3
build_flags =
  ${env:aquaguard_s3.build_flags}
  -DAQUAGUARD_SIMULATION=1

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_framework = unity
test_filter = test_core
lib_compat_mode = off
